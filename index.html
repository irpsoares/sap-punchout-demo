<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PunchOut Demo – Materiais</title>
  <script src="https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm/dist/duckdb-browser.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 6px; font-size: 12px; }
    th { background: #eee; }
  </style>
</head>
<body>

<h2>Catálogo de Materiais (Demo)</h2>
<div id="status">Carregando dados...</div>
<table id="table"></table>

<script>
(async () => {
  const status = document.getElementById("status");

  const bundle = await duckdb.selectBundle(duckdb.getJsDelivrBundles());
  const worker = new Worker(bundle.mainWorker);
  const logger = new duckdb.ConsoleLogger();
  const db = new duckdb.AsyncDuckDB(logger, worker);
  await db.instantiate(bundle.mainModule);

  const conn = await db.connect();

  const parquetUrl =
    const parquetUrl =
  "https://raw.githubusercontent.com/irpsaress/sap-punchout-demo/main/data/Cadastro_materiais.parquet";

  await db.registerFileURL("materiais.parquet", parquetUrl);

  const result = await conn.query(`
    SELECT * FROM 'materiais.parquet' LIMIT 50
  `);

  const table = document.getElementById("table");
  const columns = result.schema.fields.map(f => f.name);

  table.innerHTML = `
    <thead>
      <tr>${columns.map(c => `<th>${c}</th>`).join("")}</tr>
    </thead>
    <tbody>
      ${result.toArray().map(row =>
        `<tr>${columns.map(c => `<td>${row[c] ?? ""}</td>`).join("")}</tr>`
      ).join("")}
    </tbody>
  `;

  status.innerText = `Registros exibidos: ${result.numRows}`;
})();
</script>

</body>
</html>
